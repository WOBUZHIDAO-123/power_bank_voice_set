<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备语音设置</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="tag">USB 语音设置</span><h1>换一种语言，<br>熟悉的声音。</h1><p>连接设备，选择语种，将新的语音写入设备。</p></header>
<section><div class="row"><h2>01 · 连接设备</h2><span id="connection">未连接</span></div><button id="connect">连接设备</button><p id="support" class="hint"></p><p id="diagnostic" class="hint" role="status" aria-live="polite">????????????????????????</p></section>
<section><h2>02 · 选择语种</h2><label for="language">准备写入的语种</label><div class="row controls"><select id="language"><option value="">请选择语种</option></select><button id="preview" disabled>试听</button></div><p id="history" class="hint">暂无记录</p><p class="hint">历史记录仅供参考，不跟随设备或在不同浏览器间共享。</p><p id="resource" role="status"></p><p id="audio-message" role="status"></p></section>
<section><h2>03 · 写入语音</h2><p class="warning">更换会覆盖原有语音，过程中请勿拔线或关闭页面。取消不会恢复已覆盖的内容。</p><div class="row controls"><button id="start" class="primary" disabled>开始烧录</button><button id="cancel" disabled>取消操作</button></div><div class="progress-label"><span id="stage" role="status" aria-live="polite">等待连接设备并选择语种</span><span id="percent"></span></div><progress id="progress" max="100" value="0" aria-label="写入进度"></progress><p id="result" role="status" aria-live="polite"></p><p id="storage" class="hint"></p></section>
<footer>试听由电脑播放 · 每次完整替换一种语音</footer></main><script type="module" src="app.js"></script></body></html>
